[package]
name = "bakta-web-backend"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
lazy_static = "1.5.1"
rand = "0.10.3"
prometheus-client = "0.25.1"
regex = "1.13.1"
reqsign = { version = "0.20.7", features = ["aws"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
